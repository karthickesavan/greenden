<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Greenden - Contact</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body>


    <!-- Navbar -->

    <nav class="bg-green-100 p-4 sticky top-0 z-50 shadow-md">

        <div class="flex justify-between items-center">

            <h1 class="text-2xl font-bold text-green-800">
                GREENDEN
            </h1>


            <!-- Desktop Navigation -->

            <ul class="hidden md:flex gap-8">

                <li>
                    <a href="index.html" class="hover:text-green-600">
                        Home
                    </a>
                </li>

                <li>
                    <a href="product.html" class="hover:text-green-600">
                        Products
                    </a>
                </li>

                <li>
                    <a href="contact.html"
                        class="text-green-600 font-semibold">
                        Contact
                    </a>
                </li>

            </ul>


            <!-- Mobile Menu Icon -->

            <div class="md:hidden">

                <svg xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="2"
                    stroke="currentColor"
                    class="w-7 h-7 text-green-800">

                    <path stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />

                </svg>

            </div>

        </div>

    </nav>


    <!-- Contact Section -->

    <section class="bg-green-50 px-6 py-14 md:px-12 lg:px-20">

        <h1 class="text-3xl font-bold text-center text-green-900 mb-3">
            Contact Us
        </h1>

        <p class="text-center text-gray-600 mb-10">
            We would love to hear from you.
        </p>


        <!-- Contact Form -->

        <div class="max-w-xl mx-auto bg-white p-6 md:p-8 rounded-lg shadow">

            <form>


                <!-- Name -->

                <div class="mb-5">

                    <label class="block font-semibold mb-2">
                        Name
                    </label>

                    <input type="text"
                        placeholder="Enter your name"
                        class="w-full border border-gray-300 p-3 rounded outline-none focus:border-green-600">

                </div>


                <!-- Email -->

                <div class="mb-5">

                    <label class="block font-semibold mb-2">
                        Email
                    </label>

                    <input type="email"
                        placeholder="Enter your email"
                        class="w-full border border-gray-300 p-3 rounded outline-none focus:border-green-600">

                </div>


                <!-- Phone -->

                <div class="mb-5">

                    <label class="block font-semibold mb-2">
                        Phone
                    </label>

                    <input type="text"
                        placeholder="Enter your phone number"
                        class="w-full border border-gray-300 p-3 rounded outline-none focus:border-green-600">

                </div>


                <!-- Message -->

                <div class="mb-5">

                    <label class="block font-semibold mb-2">
                        Message
                    </label>

                    <textarea
                        rows="5"
                        placeholder="Enter your message"
                        class="w-full border border-gray-300 p-3 rounded outline-none focus:border-green-600"></textarea>

                </div>


                <!-- Submit Button -->

                <button type="submit"
                    class="w-full bg-green-700 text-white p-3 rounded hover:bg-green-800">

                    Send Message

                </button>


            </form>

        </div>

    </section>


    <!-- Footer -->

    <footer class="bg-green-900 text-white px-6 py-10 md:px-12 lg:px-20">

        <h2 class="text-2xl font-bold mb-3">
            GREENDEN
        </h2>

        <p class="text-green-100">
            Bringing the beauty of nature into your home.
        </p>

        <p class="text-green-200 mt-6 text-sm">
            © 2026 Greenden. All rights reserved.
        </p>

    </footer>


</body>

</html>
