<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Greenden - Contact</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body>


    <!-- Navbar -->

    <nav class="bg-green-100 p-4">

        <div class="flex justify-between items-center">

            <h1 class="text-xl sm:text-2xl font-bold text-green-800">
                GREENDEN
            </h1>


            <ul class="flex gap-3 sm:gap-6 text-sm sm:text-base">

                <li>
                    <a href="index.html" class="hover:text-green-600">
                        Home
                    </a>
                </li>

                <li>
                    <a href="product.html" class="hover:text-green-600">
                        Products
                    </a>
                </li>

                <li>
                    <a href="contact.html" class="text-green-600 font-semibold">
                        Contact
                    </a>
                </li>

            </ul>

        </div>

    </nav>



    <!-- Contact Section -->

    <section class="bg-green-50 p-6 sm:p-10 md:p-14 lg:p-16">


        <h1 class="text-2xl sm:text-3xl font-bold text-center text-green-900 mb-3">

            Contact Us

        </h1>


        <p class="text-center text-gray-600 text-sm sm:text-base mb-8 sm:mb-10">

            Have a question? Send us a message.

        </p>



        <!-- Contact Form -->

        <div class="w-full sm:max-w-lg md:max-w-xl mx-auto bg-white p-5 sm:p-8 rounded-lg shadow">


            <form>


                <!-- Name -->

                <div class="mb-5">

                    <label class="block font-semibold mb-2">

                        Name

                    </label>


                    <input type="text"
                        placeholder="Enter your name"
                        class="w-full border border-gray-300 p-3 rounded outline-none focus:border-green-600">

                </div>



                <!-- Email -->

                <div class="mb-5">

                    <label class="block font-semibold mb-2">

                        Email

                    </label>


                    <input type="email"
                        placeholder="Enter your email"
                        class="w-full border border-gray-300 p-3 rounded outline-none focus:border-green-600">

                </div>



                <!-- Phone -->

                <div class="mb-5">

                    <label class="block font-semibold mb-2">

                        Phone

                    </label>


                    <input type="text"
                        placeholder="Enter your phone number"
                        class="w-full border border-gray-300 p-3 rounded outline-none focus:border-green-600">

                </div>



                <!-- Message -->

                <div class="mb-5">

                    <label class="block font-semibold mb-2">

                        Message

                    </label>


                    <textarea
                        placeholder="Enter your message"
                        rows="5"
                        class="w-full border border-gray-300 p-3 rounded outline-none focus:border-green-600"></textarea>

                </div>



                <!-- Button -->

                <button
                    type="submit"
                    class="w-full bg-green-600 text-white p-3 rounded hover:bg-green-700">

                    Send Message

                </button>


            </form>

        </div>

    </section>



    <!-- Footer -->

    <footer class="bg-green-900 text-white p-6 sm:p-8">

        <h2 class="text-xl sm:text-2xl font-bold mb-3">

            GREENDEN

        </h2>


        <p class="text-green-100 text-sm sm:text-base">

            Bring nature into your home with beautiful plants.

        </p>


        <p class="text-green-200 text-sm mt-5">

            © 2026 Greenden. All rights reserved.

        </p>

    </footer>


</body>

</html>
